name: Android CI
on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch: # 手动触发，随时编译

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 彻底解决 Node.js 20 弃用警告
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive # 递归拉取子模块（sing-box核心必须）

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle (Debug版，直接可安装)
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: sing-box-android-debug-apk
        path: app/build/outputs/apk/debug/*.apk
